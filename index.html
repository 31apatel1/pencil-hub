<!DOCTYPE html>
<html>
<head>
<title>Pencil Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  overflow: hidden;
  background: black;
}

/* ===== NEON BACKGROUND ===== */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(circle at 20% 20%, #00f5ff33, transparent 40%),
    radial-gradient(circle at 80% 30%, #7b2ff733, transparent 40%),
    radial-gradient(circle at 40% 80%, #ff00ff22, transparent 40%);
  animation: bgMove 12s infinite alternate ease-in-out;
  z-index: -1;
}

@keyframes bgMove {
  from { transform: translate(-10%, -10%) scale(1); }
  to { transform: translate(10%, 10%) scale(1.2); }
}

/* ===== FADE ===== */
.fade {
  animation: fadeIn 0.6s forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* ===== LAYOUT ===== */
#app {
  display: flex;
  height: 100vh;
}

/* ===== SIDEBAR (Roblox style) ===== */
#sidebar {
  width: 220px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

.logo {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
  text-shadow: 0 0 10px cyan;
}

.navBtn {
  padding: 10px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.navBtn:hover {
  background: rgba(0,255,255,0.2);
  transform: scale(1.05);
}

/* ===== MAIN AREA ===== */
#main {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

/* ===== HOME GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* game cards (Roblox style) */
.card {
  height: 140px;
  border-radius: 18px;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 15px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: 0.25s;
}

.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px rgba(0,255,255,0.3);
}

/* ===== GAME VIEW ===== */
.game {
  display: none;
}

/* canvas style */
canvas {
  background: rgba(0,0,0,0.4);
  border-radius: 12px;
}

/* cookie */
.cookie {
  font-size: 90px;
  cursor: pointer;
  transition: 0.2s;
}
.cookie:hover { transform: scale(1.2); }

/* dot */
.dot {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: red;
  position: absolute;
  box-shadow: 0 0 20px red;
}
</style>
</head>

<body>

<div id="app">

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar" class="fade">
    <div class="logo">🖊 Pencil Hub</div>

    <button class="navBtn" onclick="goHome()">🏠 Home</button>
    <button class="navBtn" onclick="openGame('cookie')">🍪 Cookie Clicker</button>
    <button class="navBtn" onclick="openGame('tag')">🎯 Tag</button>
    <button class="navBtn" onclick="openGame('dash')">⚡ Dash</button>
    <button class="navBtn" onclick="openGame('runner')">🏃 Runner</button>
  </div>

  <!-- ===== MAIN ===== -->
  <div id="main">

    <!-- HOME SCREEN -->
    <div id="home" class="fade">

      <h1>🎮 Discover Games</h1>

      <div class="grid">

        <div class="card" onclick="openGame('cookie')">
          🍪
          <h3>Cookie Clicker</h3>
        </div>

        <div class="card" onclick="openGame('tag')">
          🎯
          <h3>Tag Game</h3>
        </div>

        <div class="card" onclick="openGame('dash')">
          ⚡
          <h3>Dash</h3>
        </div>

        <div class="card" onclick="openGame('runner')">
          🏃
          <h3>Runner</h3>
        </div>

      </div>
    </div>

    <!-- COOKIE -->
    <div id="cookie" class="game fade">
      <h2>Cookie Clicker</h2>
      <div class="cookie" onclick="cookies++; updateCookie()">🍪</div>
      <p>Cookies: <span id="cookieCount">0</span></p>
    </div>

    <!-- TAG -->
    <div id="tag" class="game fade">
      <h2>Tag Game</h2>
      <div class="dot" id="dot" onclick="tag++; moveDot()"></div>
      <p>Score: <span id="tagScore">0</span></p>
    </div>

    <!-- DASH -->
    <div id="dash" class="game fade">
      <h2>Dash Game</h2>
      <canvas id="dashCanvas" width="500" height="200"></canvas>
    </div>

    <!-- RUNNER -->
    <div id="runner" class="game fade">
      <h2>Runner Game</h2>
      <canvas id="runnerCanvas" width="500" height="200"></canvas>
    </div>

  </div>
</div>

<script>

/* ===== NAV ===== */
function goHome() {
  hideAll();
  document.getElementById("home").style.display = "block";
}

function openGame(id) {
  hideAll();
  document.getElementById(id).style.display = "block";
}

function hideAll() {
  document.querySelectorAll(".game").forEach(g => g.style.display = "none");
  document.getElementById("home").style.display = "none";
}

/* ===== COOKIE ===== */
let cookies = 0;
function updateCookie() {
  document.getElementById("cookieCount").innerText = cookies;
}

/* ===== TAG ===== */
let tag = 0;
function moveDot() {
  let d = document.getElementById("dot");
  d.style.left = Math.random() * 350 + "px";
  d.style.top = Math.random() * 250 + "px";
}
moveDot();

/* ===== DASH ===== */
const d = document.getElementById("dashCanvas");
const dx = d.getContext("2d");

let y = 150, v = 0, g = 1;
let ox = 500;

document.addEventListener("keydown", e => {
  if (e.code === "Space") v = -12;
});

function dashLoop() {
  dx.clearRect(0,0,500,200);

  dx.fillStyle = "white";
  dx.fillRect(0,180,500,20);

  v += g;
  y += v;
  if (y > 150) y = 150;

  dx.fillStyle = "cyan";
  dx.fillRect(60, y, 20, 20);

  ox -= 6;
  if (ox < -20) ox = 500;

  dx.fillStyle = "red";
  dx.fillRect(ox, 160, 20, 20);

  requestAnimationFrame(dashLoop);
}
dashLoop();

/* ===== RUNNER ===== */
const r = document.getElementById("runnerCanvas");
const rx = r.getContext("2d");

let ry = 160, j = 0, ox2 = 500;

document.addEventListener("keydown", e => {
  if (e.code === "ArrowUp") j = -15;
});

function run() {
  rx.clearRect(0,0,500,200);

  rx.fillStyle = "white";
  rx.fillRect(0,180,500,20);

  j += 1;
  ry += j;
  if (ry > 160) ry = 160;

  rx.fillStyle = "lime";
  rx.fillRect(60, ry, 20, 20);

  ox2 -= 6;
  if (ox2 < -20) ox2 = 500;

  rx.fillStyle = "orange";
  rx.fillRect(ox2, 160, 20, 20);

  requestAnimationFrame(run);
}
run();

</script>

</body>
</html>
