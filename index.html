<!DOCTYPE html>
<html>
<head>
<title>Pencil Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: #05010a;
  overflow: hidden;
}

/* ===== SPACE BACKGROUND ===== */
body::before {
  content: "";
  position: fixed;
  width: 300%;
  height: 300%;
  background:
    radial-gradient(circle at 20% 20%, rgba(168,85,247,0.35), transparent 40%),
    radial-gradient(circle at 70% 40%, rgba(255,255,255,0.06), transparent 35%),
    radial-gradient(circle at 40% 80%, rgba(99,102,241,0.25), transparent 45%),
    radial-gradient(circle at 90% 90%, rgba(168,85,247,0.18), transparent 40%);
  animation: drift 20s linear infinite;
  z-index: -1;
}

@keyframes drift {
  0% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-10%, -10%) scale(1.2); }
  100% { transform: translate(0,0) scale(1); }
}

/* ===== INTRO ===== */
#intro {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #0a0014, #000);
  backdrop-filter: blur(20px);
  z-index: 999;
}

/* galaxy layers */
#intro::before,
#intro::after {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(circle at 30% 30%, rgba(168,85,247,0.35), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(99,102,241,0.25), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 35%);
  animation: swirl 14s linear infinite;
  filter: blur(12px);
}

#intro::after {
  animation: swirl 22s linear infinite reverse;
  opacity: 0.7;
}

@keyframes swirl {
  0% { transform: translate(0,0) rotate(0deg) scale(1); }
  50% { transform: translate(-8%, 6%) rotate(180deg) scale(1.2); }
  100% { transform: translate(0,0) rotate(360deg) scale(1); }
}

/* stars */
.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.15;
  animation: starMove 10s linear infinite;
}

@keyframes starMove {
  from { transform: translateY(0); }
  to { transform: translateY(-60px); }
}

/* title */
.title {
  font-size: 70px;
  padding: 25px 50px;
  border-radius: 50px;
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 50px rgba(168,85,247,0.4);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}

/* play */
#playBtn {
  margin-top: 30px;
  padding: 15px 50px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  color: white;
  background: linear-gradient(45deg, #8b5cf6, #0f172a);
  box-shadow: 0 0 30px rgba(168,85,247,0.4);
  transition: 0.3s;
}

#playBtn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 60px rgba(168,85,247,0.7);
}

/* fade */
.fadeOut {
  animation: fadeOut 0.8s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; transform: scale(1.1); }
}

/* ===== APP ===== */
#app {
  display: none;
  height: 100vh;
}

/* sidebar */
#sidebar {
  width: 220px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-right: 1px solid rgba(168,85,247,0.2);
}

.logo {
  font-size: 22px;
  margin-bottom: 20px;
  text-shadow: 0 0 12px rgba(168,85,247,0.8);
}

.navBtn {
  padding: 10px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.navBtn:hover {
  background: rgba(168,85,247,0.25);
  transform: scale(1.05);
  box-shadow: 0 0 18px rgba(168,85,247,0.4);
}

/* main */
#main {
  flex: 1;
  padding: 20px;
}

/* grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.card {
  height: 140px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  border: 1px solid rgba(168,85,247,0.15);
  transition: 0.25s;
}

.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 30px rgba(168,85,247,0.35);
}
</style>
</head>

<body>

<!-- ===== INTRO ===== -->
<div id="intro">
  <div class="stars"></div>
  <div class="title">🖊 Pencil Hub</div>
  <button id="playBtn" onclick="start()">Play</button>
</div>

<!-- ===== APP ===== -->
<div id="app">

  <div id="sidebar">
    <div class="logo">🖊 Pencil Hub</div>

    <!-- YOUR REAL GAMES -->
    <button class="navBtn" onclick="location.href='clcookieclicker.html'">🍪 Cookie Clicker</button>

    <button class="navBtn" onclick="location.href='clescaperoadcity2.html'">🚗 Escape Road City</button>
  </div>

  <div id="main">
    <h1>🎮 Games</h1>

    <div class="grid">
      <div class="card" onclick="location.href='clcookieclicker.html'">🍪 Cookie Clicker</div>

      <div class="card" onclick="location.href='clescaperoadcity2.html'">🚗 Escape Road City</div>
    </div>
  </div>

</div>

<script>

/* intro start */
function start() {
  document.getElementById("intro").classList.add("fadeOut");

  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("app").style.display = "flex";
  }, 800);
}

</script>

</body>
</html>
