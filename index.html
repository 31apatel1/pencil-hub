<!DOCTYPE html>
<html>
<head>
<title>Pencil Hub</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#05010a;
color:white;
overflow:hidden;
}

/* ================= BACKGROUND ================= */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(168,85,247,.30), transparent 40%),
radial-gradient(circle at 70% 40%, rgba(99,102,241,.20), transparent 45%),
radial-gradient(circle at 40% 80%, rgba(255,255,255,.05), transparent 50%);
animation:drift 18s ease-in-out infinite;
z-index:-2;
}

@keyframes drift{
0%{transform:scale(1) translate(0,0);}
50%{transform:scale(1.15) translate(-5%,-5%);}
100%{transform:scale(1) translate(0,0);}
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:radial-gradient(circle at center,#0a0014,#000);
z-index:999;
overflow:hidden;
}

#intro::before{
content:"";
position:absolute;
inset:-50%;
background:
radial-gradient(circle at 30% 30%, rgba(168,85,247,.35), transparent 40%),
radial-gradient(circle at 70% 60%, rgba(99,102,241,.25), transparent 45%);
animation:swirl 14s linear infinite;
filter:blur(20px);
}

@keyframes swirl{
0%{transform:rotate(0deg) scale(1);}
100%{transform:rotate(360deg) scale(1.2);}
}

.stars{
position:absolute;
inset:0;
background-image:radial-gradient(white 1px, transparent 1px);
background-size:40px 40px;
opacity:.12;
animation:starMove 10s linear infinite;
}

@keyframes starMove{
from{transform:translateY(0);}
to{transform:translateY(-60px);}
}

.title{
font-size:64px;
padding:20px 45px;
border-radius:40px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(12px);
box-shadow:0 0 40px rgba(168,85,247,.4);
animation:float 3s ease-in-out infinite;
z-index:2;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

#playBtn{
margin-top:25px;
padding:14px 48px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
color:white;
background:linear-gradient(45deg,#8b5cf6,#111827);
box-shadow:0 0 35px rgba(168,85,247,.4);
transition:.25s;
z-index:2;
}

#playBtn:hover{
transform:scale(1.08);
box-shadow:0 0 60px rgba(168,85,247,.6);
}

.fadeOut{
animation:fadeOut .7s forwards;
}

@keyframes fadeOut{
to{
opacity:0;
transform:scale(1.05);
}
}

/* ================= APP ================= */
#app{
display:none;
height:100vh;
}

/* ================= SIDEBAR ================= */
#sidebar{
width:230px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(16px);
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
border-right:1px solid rgba(168,85,247,.2);
z-index:5;
}

.logo{
font-size:24px;
margin-bottom:10px;
text-shadow:0 0 12px rgba(168,85,247,.7);
}

.navBtn{
padding:14px;
border-radius:14px;
background:rgba(255,255,255,.08);
color:white;
border:none;
cursor:pointer;
font-size:15px;
transition:.2s;
}

.navBtn:hover{
background:rgba(168,85,247,.25);
transform:scale(1.04);
box-shadow:0 0 18px rgba(168,85,247,.35);
}

/* ================= MAIN ================= */
#main{
flex:1;
padding:20px;
display:flex;
flex-direction:column;
overflow:hidden;
}

h1{
margin-top:0;
margin-bottom:20px;
}

/* ================= GRID ================= */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.card{
height:160px;
border-radius:20px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(12px);
display:flex;
justify-content:center;
align-items:center;
border:1px solid rgba(168,85,247,.15);
transition:.25s;
font-size:20px;
cursor:pointer;
}

.card:hover{
transform:scale(1.04);
box-shadow:0 0 25px rgba(168,85,247,.35);
}

/* ================= GAME VIEWER ================= */
#viewer{
display:none;
flex:1;
border-radius:18px;
overflow:hidden;
border:1px solid rgba(168,85,247,.2);
background:black;
box-shadow:0 0 25px rgba(168,85,247,.2);
}

iframe{
width:100%;
height:100%;
border:none;
background:black;
}

/* top bar */
#topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

#backBtn{
display:none;
padding:10px 18px;
border:none;
border-radius:12px;
cursor:pointer;
background:rgba(168,85,247,.25);
color:white;
transition:.2s;
}

#backBtn:hover{
transform:scale(1.05);
box-shadow:0 0 18px rgba(168,85,247,.35);
}
</style>
</head>

<body>

<!-- ================= INTRO ================= -->
<div id="intro">

<div class="stars"></div>

<div class="title">🖊 Pencil Hub</div>

<button id="playBtn" onclick="start()">
Play
</button>

</div>

<!-- ================= APP ================= -->
<div id="app">

<!-- sidebar -->
<div id="sidebar">

<div class="logo">🖊 Pencil Hub</div>

<button class="navBtn" onclick="loadGame('clcookieclicker.html')">
🍪 Cookie Clicker
</button>

<button class="navBtn" onclick="loadGame('clescaperoadcity2.html')">
🚗 Escape Road City
</button>

</div>

<!-- main -->
<div id="main">

<div id="topbar">

<h1 id="pageTitle">🎮 Games</h1>

<button id="backBtn" onclick="goHome()">
⬅ Back
</button>

</div>

<!-- home -->
<div id="home" class="grid">

<div class="card" onclick="loadGame('clcookieclicker.html')">
🍪 Cookie Clicker
</div>

<div class="card" onclick="loadGame('clescaperoadcity2.html')">
🚗 Escape Road City
</div>

</div>

<!-- iframe viewer -->
<div id="viewer">

<iframe id="gameFrame"></iframe>

</div>

</div>

</div>

<script>

/* ================= INTRO ================= */
function start(){

const intro=document.getElementById("intro");
const app=document.getElementById("app");

intro.classList.add("fadeOut");

setTimeout(()=>{
intro.style.display="none";
app.style.display="flex";
},700);

}

/* ================= GAME LOADER ================= */
function loadGame(file){

document.getElementById("home").style.display="none";

document.getElementById("viewer").style.display="block";

document.getElementById("backBtn").style.display="block";

document.getElementById("pageTitle").innerText="🎮 Playing";

document.getElementById("gameFrame").src=file;

}

/* ================= HOME ================= */
function goHome(){

document.getElementById("viewer").style.display="none";

document.getElementById("home").style.display="grid";

document.getElementById("backBtn").style.display="none";

document.getElementById("pageTitle").innerText="🎮 Games";

/* stops game */
document.getElementById("gameFrame").src="";

}

</script>

</body>
</html>
