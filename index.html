<!DOCTYPE html>
<html>
<head>
<title>Home | Schoology</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  overflow: hidden;
  background: black;
}

/* ===== ANIMATED BACKGROUND ===== */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 20% 20%, #00f5ff33, transparent 40%),
              radial-gradient(circle at 80% 30%, #7b2ff733, transparent 40%),
              radial-gradient(circle at 40% 80%, #ff00ff22, transparent 40%);
  animation: moveBg 10s infinite alternate ease-in-out;
  z-index: -1;
}

@keyframes moveBg {
  from { transform: translate(-10%, -10%) scale(1); }
  to { transform: translate(10%, 10%) scale(1.2); }
}

/* ===== FADE IN SYSTEM ===== */
.fade {
  opacity: 0;
  animation: fadeIn 1s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* ===== INTRO ===== */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(10px);
}

.title {
  font-size: 70px;
  padding: 25px 50px;
  border-radius: 50px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 40px rgba(0,255,255,0.3);
  animation: float 3s infinite ease-in-out, fadeIn 1.5s forwards;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0px); }
}

#playBtn {
  margin-top: 30px;
  padding: 15px 50px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  color: white;
  background: linear-gradient(45deg, #00f5ff, #7b2ff7);
  box-shadow: 0 0 25px rgba(0,255,255,0.4);
  transition: 0.3s;
  animation: fadeIn 2s forwards;
}

#playBtn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 50px rgba(0,255,255,0.7);
}

/* ===== HUB ===== */
#hub {
  display: none;
  text-align: center;
  padding: 20px;
  animation: fadeIn 1s forwards;
}

/* glass panel */
.panel {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 20px;
  margin-top: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

/* buttons */
button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: rgba(255,255,255,0.08);
  color: white;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  background: rgba(0,255,255,0.2);
  box-shadow: 0 0 20px rgba(0,255,255,0.3);
}

/* games */
.game {
  display: none;
  margin-top: 20px;
  animation: fadeIn 0.6s forwards;
}

/* cookie */
.cookie {
  font-size: 90px;
  cursor: pointer;
  transition: 0.2s;
}

.cookie:hover {
  transform: scale(1.2);
}

/* dot */
.dot {
  width: 50px;
  height: 50px;
  background: red;
  border-radius: 50%;
  position: absolute;
  box-shadow: 0 0 20px red;
}

/* canvas */
canvas {
  background: rgba(0,0,0,0.4);
  border-radius: 15px;
  box-shadow: 0 0 25px rgba(0,255,255,0.15);
}
</style>
</head>

<body>

<!-- ===== INTRO ===== -->
<div id="intro">
  <div class="title">🖊 Pencil Hub</div>
  <button id="playBtn" onclick="start()">Play</button>
</div>

<!-- ===== HUB ===== -->
<div id="hub">

<h1 class="fade">🎮 Game Hub</h1>

<div class="panel fade">
  <button onclick="show('cookie')">Cookie Clicker</button>
  <button onclick="show('tag')">Tag</button>
  <button onclick="show('dash')">Dash</button>
  <button onclick="show('runner')">Runner</button>
</div>

<!-- COOKIE -->
<div id="cookie" class="game panel">
  <h2>Cookie Clicker</h2>
  <div class="cookie" onclick="cookies++; updateCookie()">🍪</div>
  <p>Cookies: <span id="cookieCount">0</span></p>
</div>

<!-- TAG -->
<div id="tag" class="game panel">
  <h2>Tag Game</h2>
  <div class="dot" id="dot" onclick="tag++; moveDot()"></div>
  <p>Score: <span id="tagScore">0</span></p>
</div>

<!-- DASH -->
<div id="dash" class="game panel">
  <h2>Dash Game</h2>
  <canvas id="dashCanvas" width="400" height="200"></canvas>
</div>

<!-- RUNNER -->
<div id="runner" class="game panel">
  <h2>Runner Game</h2>
  <canvas id="runnerCanvas" width="400" height="200"></canvas>
</div>

</div>

<script>

/* ===== INTRO ===== */
function start() {
  document.getElementById("intro").style.transition = "1s";
  document.getElementById("intro").style.opacity = "0";

  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("hub").style.display = "block";
  }, 900);
}

/* ===== MENU ===== */
function show(id) {
  document.querySelectorAll(".game").forEach(g => g.style.display = "none");
  document.getElementById(id).style.display = "block";
}

/* ===== COOKIE ===== */
let cookies = 0;
function updateCookie() {
  document.getElementById("cookieCount").innerText = cookies;
}

/* ===== TAG ===== */
let tag = 0;
function moveDot() {
  let d = document.getElementById("dot");
  d.style.left = Math.random() * 300 + "px";
  d.style.top = Math.random() * 250 + "px";
}
moveDot();

/* ===== DASH ===== */
const d = document.getElementById("dashCanvas");
const dx = d.getContext("2d");

let y = 150, v = 0, g = 1;
let ox = 400;

document.addEventListener("keydown", e => {
  if (e.code === "Space") v = -12;
});

function dash() {
  dx.clearRect(0,0,400,200);

  dx.fillStyle = "white";
  dx.fillRect(0,180,400,20);

  v += g;
  y += v;
  if (y > 150) y = 150;

  dx.fillStyle = "cyan";
  dx.fillRect(50, y, 20, 20);

  ox -= 5;
  if (ox < -20) ox = 400;

  dx.fillStyle = "red";
  dx.fillRect(ox, 160, 20, 20);

  requestAnimationFrame(dash);
}
dash();

/* ===== RUNNER ===== */
const r = document.getElementById("runnerCanvas");
const rx = r.getContext("2d");

let ry = 160, j = 0, ox2 = 400;

document.addEventListener("keydown", e => {
  if (e.code === "ArrowUp") j = -15;
});

function run() {
  rx.clearRect(0,0,400,200);

  rx.fillStyle = "white";
  rx.fillRect(0,180,400,20);

  j += 1;
  ry += j;
  if (ry > 160) ry = 160;

  rx.fillStyle = "lime";
  rx.fillRect(50, ry, 20, 20);

  ox2 -= 6;
  if (ox2 < -20) ox2 = 400;

  rx.fillStyle = "orange";
  rx.fillRect(ox2, 160, 20, 20);

  requestAnimationFrame(run);
}
run();

</script>

</body>
</html>
