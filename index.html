<!DOCTYPE html>
<html>
<head>
<title>Pencil Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: #05010a;
  overflow: hidden;
}

/* ================= SPACE BACKGROUND (MAIN SITE) ================= */
body::before {
  content: "";
  position: fixed;
  width: 300%;
  height: 300%;
  background:
    radial-gradient(circle at 20% 20%, rgba(168,85,247,0.35), transparent 40%),
    radial-gradient(circle at 70% 40%, rgba(255,255,255,0.06), transparent 35%),
    radial-gradient(circle at 40% 80%, rgba(99,102,241,0.25), transparent 45%),
    radial-gradient(circle at 90% 90%, rgba(168,85,247,0.18), transparent 40%);
  animation: drift 20s linear infinite;
  z-index: -1;
}

@keyframes drift {
  0% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-10%, -10%) scale(1.2); }
  100% { transform: translate(0,0) scale(1); }
}

/* ================= INTRO ================= */
#intro {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: radial-gradient(circle at center, #0a0014, #000);
  z-index: 999;
}

/* galaxy swirl layers */
#intro::before,
#intro::after {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(circle at 30% 30%, rgba(168,85,247,0.35), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(99,102,241,0.25), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 35%);
  animation: swirl 14s linear infinite;
  filter: blur(12px);
}

#intro::after {
  animation: swirl 22s linear infinite reverse;
  opacity: 0.7;
}

@keyframes swirl {
  0% { transform: translate(0,0) rotate(0deg) scale(1); }
  50% { transform: translate(-8%, 6%) rotate(180deg) scale(1.2); }
  100% { transform: translate(0,0) rotate(360deg) scale(1); }
}

/* star layer */
.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.15;
  animation: starMove 10s linear infinite;
}

@keyframes starMove {
  from { transform: translateY(0); }
  to { transform: translateY(-60px); }
}

/* title */
.title {
  font-size: 70px;
  padding: 25px 50px;
  border-radius: 50px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow:
    0 0 40px rgba(168,85,247,0.4),
    0 0 90px rgba(99,102,241,0.25);
  animation: float 3s ease-in-out infinite;
  z-index: 2;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}

/* play button */
#playBtn {
  z-index: 2;
  margin-top: 30px;
  padding: 15px 50px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  color: white;
  background: linear-gradient(45deg, #8b5cf6, #0f172a);
  box-shadow:
    0 0 30px rgba(168,85,247,0.4),
    0 0 80px rgba(99,102,241,0.2);
  transition: 0.3s;
}

#playBtn:hover {
  transform: scale(1.15);
  box-shadow:
    0 0 60px rgba(168,85,247,0.7),
    0 0 100px rgba(99,102,241,0.4);
}

/* fade out */
.fadeOut {
  animation: fadeOut 0.8s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; transform: scale(1.1); }
}

/* ================= APP ================= */
#app {
  display: none;
  height: 100vh;
}

/* sidebar */
#sidebar {
  width: 220px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-right: 1px solid rgba(168,85,247,0.2);
}

.logo {
  font-size: 22px;
  margin-bottom: 20px;
  text-shadow: 0 0 12px rgba(168,85,247,0.8);
}

.navBtn {
  padding: 10px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.navBtn:hover {
  background: rgba(168,85,247,0.25);
  transform: scale(1.05);
  box-shadow: 0 0 18px rgba(168,85,247,0.4);
}

/* main */
#main {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

/* grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.card {
  height: 140px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  border: 1px solid rgba(168,85,247,0.15);
  transition: 0.25s;
}

.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 30px rgba(168,85,247,0.35);
}

/* games */
.game { display: none; }

.panel {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  padding: 20px;
  border-radius: 18px;
  border: 1px solid rgba(168,85,247,0.15);
}

/* cookie */
.cookie {
  font-size: 90px;
  cursor: pointer;
}

/* tag */
.dot {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: red;
  position: absolute;
  box-shadow: 0 0 20px red;
}

/* canvas */
canvas {
  background: rgba(0,0,0,0.4);
  border-radius: 12px;
}
</style>
</head>

<body>

<!-- ================= INTRO ================= -->
<div id="intro">
  <div class="stars"></div>
  <div class="title">🖊 Pencil Hub</div>
  <button id="playBtn" onclick="start()">Play</button>
</div>

<!-- ================= APP ================= -->
<div id="app">

  <div id="sidebar">
    <div class="logo">🖊 Pencil Hub</div>

    <button class="navBtn" onclick="home()">🏠 Home</button>
    <button class="navBtn" onclick="openGame('cookie')">🍪 Cookie</button>
    <button class="navBtn" onclick="openGame('tag')">🎯 Tag</button>
    <button class="navBtn" onclick="openGame('dash')">⚡ Dash</button>
    <button class="navBtn" onclick="openGame('runner')">🏃 Runner</button>
  </div>

  <div id="main">

    <div id="home">
      <h1>🎮 Games</h1>

      <div class="grid">
        <div class="card" onclick="openGame('cookie')">🍪 Cookie</div>
        <div class="card" onclick="openGame('tag')">🎯 Tag</div>
        <div class="card" onclick="openGame('dash')">⚡ Dash</div>
        <div class="card" onclick="openGame('runner')">🏃 Runner</div>
      </div>
    </div>

    <div id="cookie" class="game panel">
      <h2>Cookie Clicker</h2>
      <div class="cookie" onclick="cookies++; updateCookie()">🍪</div>
      <p>Cookies: <span id="cookieCount">0</span></p>
    </div>

    <div id="tag" class="game panel">
      <h2>Tag Game</h2>
      <div class="dot" id="dot" onclick="tag++; moveDot()"></div>
      <p>Score: <span id="tagScore">0</span></p>
    </div>

    <div id="dash" class="game panel">
      <h2>Dash Game</h2>
      <canvas id="dashCanvas" width="500" height="200"></canvas>
    </div>

    <div id="runner" class="game panel">
      <h2>Runner Game</h2>
      <canvas id="runnerCanvas" width="500" height="200"></canvas>
    </div>

  </div>
</div>

<script>

/* intro */
function start() {
  document.getElementById("intro").classList.add("fadeOut");

  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("app").style.display = "flex";
    home();
  }, 800);
}

/* nav */
function home() {
  document.getElementById("home").style.display = "block";
  document.querySelectorAll(".game").forEach(g => g.style.display = "none");
}

function openGame(id) {
  document.getElementById("home").style.display = "none";
  document.querySelectorAll(".game").forEach(g => g.style.display = "none");
  document.getElementById(id).style.display = "block";
}

/* cookie */
let cookies = 0;
function updateCookie() {
  document.getElementById("cookieCount").innerText = cookies;
}

/* tag */
let tag = 0;
function moveDot() {
  let d = document.getElementById("dot");
  d.style.left = Math.random() * 350 + "px";
  d.style.top = Math.random() * 250 + "px";
}
moveDot();

/* dash */
const d = document.getElementById("dashCanvas");
const dx = d.getContext("2d");

let y = 150, v = 0, g = 1;
let ox = 500;

document.addEventListener("keydown", e => {
  if (e.code === "Space") v = -12;
});

function dash() {
  dx.clearRect(0,0,500,200);

  dx.fillStyle = "white";
  dx.fillRect(0,180,500,20);

  v += g;
  y += v;
  if (y > 150) y = 150;

  dx.fillStyle = "#a855f7";
  dx.fillRect(60, y, 20, 20);

  ox -= 6;
  if (ox < -20) ox = 500;

  dx.fillStyle = "red";
  dx.fillRect(ox, 160, 20, 20);

  requestAnimationFrame(dash);
}
dash();

/* runner */
const r = document.getElementById("runnerCanvas");
const rx = r.getContext("2d");

let ry = 160, j = 0, ox2 = 500;

document.addEventListener("keydown", e => {
  if (e.code === "ArrowUp") j = -15;
});

function run() {
  rx.clearRect(0,0,500,200);

  rx.fillStyle = "white";
  rx.fillRect(0,180,500,20);

  j += 1;
  ry += j;
  if (ry > 160) ry = 160;

  rx.fillStyle = "#22c55e";
  rx.fillRect(60, ry, 20, 20);

  ox2 -= 6;
  if (ox2 < -20) ox2 = 500;

  rx.fillStyle = "#f59e0b";
  rx.fillRect(ox2, 160, 20, 20);

  requestAnimationFrame(run);
}
run();

</script>

</body>
</html>
