<!DOCTYPE html>
<html>
<head>
<title>Pencil Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  overflow: hidden;
  background: black;
}

/* ===== BACKGROUND ===== */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(circle at 20% 20%, #00f5ff33, transparent 40%),
    radial-gradient(circle at 80% 30%, #7b2ff733, transparent 40%),
    radial-gradient(circle at 40% 80%, #ff00ff22, transparent 40%);
  animation: bgMove 12s infinite alternate ease-in-out;
  z-index: -1;
}

@keyframes bgMove {
  from { transform: translate(-10%, -10%) scale(1); }
  to { transform: translate(10%, 10%) scale(1.2); }
}

/* ===== FADE ===== */
.fade {
  animation: fadeIn 0.8s forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* ================= INTRO ================= */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(10px);
}

.title {
  font-size: 70px;
  padding: 25px 50px;
  border-radius: 50px;
  background: rgba(255,255,255,0.06);
  box-shadow: 0 0 40px rgba(0,255,255,0.3);
  animation: float 3s infinite ease-in-out, fadeIn 1.2s forwards;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}

#playBtn {
  margin-top: 30px;
  padding: 15px 50px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  color: white;
  background: linear-gradient(45deg, #00f5ff, #7b2ff7);
  box-shadow: 0 0 25px rgba(0,255,255,0.4);
  transition: 0.3s;
}

#playBtn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 50px rgba(0,255,255,0.7);
}

/* fade out intro */
.fadeOut {
  animation: fadeOut 0.8s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; transform: scale(1.1); }
}

/* ================= APP ================= */
#app {
  display: none;
  height: 100vh;
  display: flex;
}

/* SIDEBAR */
#sidebar {
  width: 220px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.logo {
  font-size: 22px;
  margin-bottom: 20px;
  text-shadow: 0 0 10px cyan;
}

.navBtn {
